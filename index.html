<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Website Sandbox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #091820;
            color: white;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            max-width: 700px;
        }

        h1 {
            font-size: clamp(50px, 8vw, 90px);
            margin: 0 0 20px;
        }

        .line {
            width: 60px;
            height: 3px;
            background: #c8a76a;
            margin: 30px auto;
        }

        p {
            color: #aab8bc;
            font-size: 20px;
            line-height: 1.6;
        }

        .domain {
            margin-top: 40px;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #c8a76a;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="content">

            <h1>Website Sandbox</h1>

            <div class="line"></div>

            <p>
                This domain is being used for website development,
                testing and experimentation.
            </p>

            <div class="domain">
                douglassemail.com
            </div>

        </div>

    </div>

</body>

</html>
