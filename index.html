<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- BLOCK SEARCH ENGINES / SEO -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

    <title>Website Sandbox</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #091820;
            color: white;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .content {
            max-width: 700px;
        }

        .badge {
            display: inline-block;
            padding: 8px 15px;
            margin-bottom: 30px;

            border: 1px solid rgba(200, 167, 106, 0.5);
            border-radius: 50px;

            color: #c8a76a;

            font-size: 11px;
            font-weight: bold;

            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(50px, 8vw, 90px);
            margin: 0 0 20px;
            line-height: 1;
        }

        .line {
            width: 60px;
            height: 3px;

            background: #c8a76a;

            margin: 30px auto;
        }

        p {
            color: #aab8bc;

            font-size: 20px;
            line-height: 1.6;

            margin: 0 auto;

            max-width: 600px;
        }

        .domain {
            margin-top: 40px;

            font-size: 13px;

            letter-spacing: 3px;
            text-transform: uppercase;

            color: #c8a76a;
        }

        .notice {
            margin-top: 18px;

            font-size: 12px;

            color: #5f737c;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="content">

            <div class="badge">
                Development Environment
            </div>

            <h1>
                Website Sandbox
            </h1>

            <div class="line"></div>

            <p>
                This domain is being used for website development,
                testing and experimentation.
            </p>

            <div class="domain">
                douglassemail.com
            </div>

            <div class="notice">
                Private development environment · Not intended for search indexing
            </div>

        </div>

    </div>

</body>

</html>
